[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "toolrecap_v3"
dynamic = ["version"]
description = "ToolRecap V3 Foundation Package"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.20.0",
    "httpx>=0.27.0",
    "windows-toasts>=1.3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.dynamic]
version = {attr = "toolrecap_v3.__version__.__version__"}

[tool.setuptools.packages.find]
include = ["toolrecap_v3*"]

[tool.setuptools.package-data]
toolrecap_v3 = ["schemas/*.json"]

